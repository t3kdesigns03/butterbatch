# Netlify build config for the Next.js (App Router) site.
# The Next.js runtime (OpenNext adapter) turns the .next build into Netlify Functions,
# Image CDN routes and response headers. It is declared explicitly below because the
# first production deploy published the raw .next folder (runtime not applied -> 404).
# No secrets or environment variables are needed for Phase 1.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
