# Netlify build config for the Next.js (App Router) site.
# Netlify detects Next.js and applies its Next.js runtime automatically (SSR, image CDN, headers
# from next.config.ts). No secrets or environment variables are needed for Phase 1.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
